<article class="book">
  <div class="book__cover">
    {{{bookCover}}}
  </div>
  <div class="book__details">
    <h1 class="book__title">{{bookTitle}}</h1>
    {{{bookAuthor}}}
    {{{bookContributors}}}
    <div class="book__buy">
      {{{bookPrice}}}
      {{{bookBuy}}}
    </div>
    <div class="book__description prose">
{{{bookDescription}}}
    </div>
  </div>
</article>
