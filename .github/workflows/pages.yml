# Publishes a preview of the site to GitHub Pages, at
# https://am21adk.github.io/burhanbooks/, on every push to main.
#
# Only the built pages in dist/ are published, never the source, SQL, tests
# or scripts. It's built like a Netlify deploy preview: noindex on every
# page and the NEEDS: gaps shown. The books come from the shop's Supabase
# project, and the admin at /burhanbooks/admin/ signs in to it. There's no
# server here to rebuild the preview when the admin publishes, so its
# Publish button links to this workflow: Run workflow rebuilds it. The real
# site, with checkout and one-press publishing, goes on Netlify (see the
# README).
#
# Needs Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Publish preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the sitemap's page dates come from git history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: node build.mjs
        env:
          BASE_PATH: /burhanbooks
          # Both public by design: the anon key only does what the access
          # rules in supabase/02_policies.sql allow a visitor or the admin.
          SUPABASE_URL: https://bsclxknfzljcsurtaswx.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzY2x4a25memxqY3N1cnRhc3d4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1NDIxMTIsImV4cCI6MjEwNjExODExMn0.6WgUVmFC0a3KhNBmTzME_Za2WdYPosw2Xt0z9lNPsqs
          PREVIEW_PUBLISH_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/pages.yml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
